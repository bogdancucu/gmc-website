name: Publicare pe GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Astro (npm install + astro build)
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Settings → Secrets and variables → Actions → New repository secret: WEB3FORMS_KEY
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
